# Milestone 3: self-play with a pool of earlier versions, plus built-in AI matches
# so the learner does not forget how to beat a fixed outside opponent.
# Start from a milestone 1 policy with: --init runs/m1b_gamma997/checkpoints/ckpt_000360.pt

[run]
seed = 2
total_steps = 10_000_000
torch_threads = 1

[game]
config = "configs/fort_1v1.cfg"
base_port = 4820

[[arenas]]
name = "builtin"
count = 1
steered_teams = 1
opponents = { builtin = 1.0 }

[[arenas]]
name = "league"
count = 2
steered_teams = 2           # both teams steered from Python, learner takes a random side
opponents = { self = 0.4, pool = 0.5, random = 0.1 }

[obs]
rays = 16
max_enemies = 1
max_mates = 0
max_own_zones = 1
max_enemy_zones = 1

[reward]
win = 1.0
loss = -1.0
draw = 0.0
death = -0.5
kill = 0.5
enemy_conquest = 1.0
own_conquest = -1.0
alive = 0.0

[ppo]
rollout_steps = 8192
epochs = 4
minibatch = 1024
lr = 2e-4
gamma = 0.997
lam = 0.95
clip = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
hidden = 256
target_kl = 0.03

[eval]
every_updates = 20
rounds = 200
# the last opponent is the frozen policy this run starts from: beating it shows real progress
opponents = ["builtin", "random", "ckpt:runs/m1b_gamma997/checkpoints/ckpt_000360.pt"]
greedy = false

[checkpoint]
every_updates = 10
pool_every_updates = 10
pool_size = 30
# earlier versions to play against from the start
pool_seed = ["runs/m1b_gamma997/checkpoints/ckpt_000100.pt", "runs/m1b_gamma997/checkpoints/ckpt_000200.pt",
             "runs/m1b_gamma997/checkpoints/ckpt_000300.pt", "runs/m1b_gamma997/checkpoints/ckpt_000360.pt"]
