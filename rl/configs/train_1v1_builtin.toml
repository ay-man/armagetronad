# Milestone 1: one learning cycle vs the game's built-in AI, 1 vs 1 Fortress.
# Paths are relative to the rl/ directory.

[run]
seed = 1
total_steps = 2_000_000
torch_threads = 1

[game]
config = "configs/fort_1v1.cfg"
# server = "/path/to/armagetronad-dedicated"   # default: build/rl_server/armagetronad-dedicated
base_port = 4800

[[arenas]]
name = "builtin"
count = 3
steered_teams = 1          # team 0 is the learner, team 1 keeps the built-in AI
opponents = { builtin = 1.0 }

[obs]
rays = 16                  # must match RL_RAYS sent to the server (set automatically)
max_enemies = 1
max_mates = 0
max_own_zones = 1
max_enemy_zones = 1

[reward]
win = 1.0
loss = -1.0
draw = 0.0
death = -0.5
kill = 0.5
enemy_conquest = 1.0
own_conquest = -1.0
alive = 0.0

[ppo]
rollout_steps = 8192
epochs = 4
minibatch = 1024
lr = 3e-4
gamma = 0.997              # ~33 s horizon; 0.99 (~10 s) plateaued near 37% wins vs built-in AI
lam = 0.95
clip = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
hidden = 256
target_kl = 0.03

[eval]
every_updates = 10
rounds = 200
opponents = ["builtin", "random"]
greedy = false

[checkpoint]
every_updates = 10
pool_every_updates = 0
