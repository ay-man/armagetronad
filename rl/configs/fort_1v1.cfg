# Game rules for 1 vs 1 Fortress training.
# Loaded by the trainer into the dedicated server; the trainer appends
# the bridge settings (socket, steered teams, port) itself.

INCLUDE examples/fortress_soccer.cfg

# run without humans, as fast as the CPU allows
DEDICATED_AI_ONLY_GAMES 1
SIMULATION_FIXED_STEP 0.025
TALK_TO_MASTER 0

# two teams of one cycle each; the server counts as single player without humans
TEAMS_MIN 2
TEAMS_MAX 2
SP_TEAMS_MIN 2
SP_TEAMS_MAX 2
TEAM_MIN_PLAYERS 1
TEAM_MAX_PLAYERS 1
SP_TEAM_MIN_PLAYERS 1
SP_TEAM_MAX_PLAYERS 1
SP_NUM_AIS 0
NUM_AIS 0
SP_MIN_PLAYERS 0
MIN_PLAYERS 0

# one endless match: a match end would cut the next round short
LIMIT_ROUNDS 1000000
SP_LIMIT_ROUNDS 1000000
LIMIT_SCORE 1000000000
SP_LIMIT_SCORE 1000000000
LIMIT_TIME 1000000
SP_LIMIT_TIME 1000000
LIMIT_ADVANCE 0
SP_LIMIT_ADVANCE 0

# observation and control
RL_DECISION_INTERVAL 0.1
RL_RAYS 16
RL_RAY_RANGE 250

# keep the server quiet on disk
LADDERLOG_WRITE_ALL 0
